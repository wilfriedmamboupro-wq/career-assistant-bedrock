name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday: new CVEs appear without any code change

permissions:
  contents: read

jobs:
  python-deps:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # what actually ships in the Lambda package
      - run: pip-audit -r backend/requirements-lambda.txt --strict

  node-deps:
    name: Node dependencies (npm audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, infra]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # production dependencies only; fails on high or critical advisories
      - run: npm audit --omit=dev --audit-level=high
