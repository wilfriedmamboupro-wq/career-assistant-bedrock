[project]
name = "career-assistant-backend"
version = "0.1.0"
description = "Career Assistant — personal prototype, not affiliated with any employer. FastAPI + Amazon Bedrock RAG (Converse API)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]  # data/, eval/ and tests/ are not part of the package

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "uvicorn>=0.32"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101", "SIM905"]  # asserts in tests; "a b c".split() word lists

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
